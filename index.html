<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedTest - Realtime Network Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SpeedTest</h1>
            <p>Realtime Network Analyzer</p>
        </header>

        <div class="card gauge-card">
            <div class="gauge-container">
                <div class="gauge" id="speedGauge"></div>
                <div class="gauge-center">
                    <div class="speed-value" id="currentSpeed">0</div>
                    <div class="speed-unit">Mbps</div>
                </div>
            </div>
            
            <div class="status-text" id="testStatus">Idle</div>
            
            <div class="action-buttons">
                <button class="btn btn-primary" id="btnStart">Start Test</button>
                <button class="btn btn-secondary" id="btnStop" disabled>Stop</button>
            </div>
        </div>

        <div class="card">
            <h2 class="card-title">Network Info</h2>
            <div class="info-grid">
                <div class="info-item">
                    <span class="label">IP</span>
                    <span class="value" id="netIp">-</span>
                </div>
                <div class="info-item">
                    <span class="label">ISP</span>
                    <span class="value" id="netIsp">-</span>
                </div>
                <div class="info-item">
                    <span class="label">Location</span>
                    <span class="value" id="netLocation">-</span>
                </div>
                <div class="info-item">
                    <span class="label">Timezone</span>
                    <span class="value" id="netTimezone">-</span>
                </div>
            </div>
        </div>

        <div class="card">
            <h2 class="card-title">Statistics</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="label">Ping</span>
                    <span class="value"><span id="statPing">0</span> ms</span>
                </div>
                <div class="stat-item">
                    <span class="label">Jitter</span>
                    <span class="value"><span id="statJitter">0</span> ms</span>
                </div>
                <div class="stat-item">
                    <span class="label">Download</span>
                    <span class="value"><span id="statDownload">0</span> Mbps</span>
                </div>
                <div class="stat-item">
                    <span class="label">Upload</span>
                    <span class="value"><span id="statUpload">0</span> Mbps</span>
                </div>
            </div>
        </div>

        <footer>
            &copy; 2026 SpeedTest Tool
        </footer>
    </div>

    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
