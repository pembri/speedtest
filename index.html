<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpeedTest</title>

  <meta name="description" content="SpeedTest realtime dengan info ISP, IP, lokasi, ping, jitter, download & upload.">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="./style.css">
</head>

<body>

<div class="bg-glow"></div>

<div class="container">

  <!-- HEADER -->
  <header class="header">
    <h1 class="logo">SpeedTest</h1>
    <p class="subtitle">Realtime Network Analyzer</p>
  </header>

  <!-- MAIN -->
  <main class="main">

    <!-- LEFT -->
    <section class="speed-section">

      <div class="speed-card">

        <div class="meter">
          <div class="meter-inner">
            <span id="speedValue">0</span>
            <span class="unit">Mbps</span>
          </div>
        </div>

        <p id="statusText" class="status">Idle</p>

        <div class="controls">
          <button id="startBtn" class="btn primary">Start Test</button>
          <button id="stopBtn" class="btn secondary" disabled>Stop</button>
        </div>

      </div>

    </section>

    <!-- RIGHT -->
    <section class="info-section">

      <!-- NETWORK -->
      <div class="card">
        <h3>Network Info</h3>
        <div class="info-grid">
          <div><span>IP</span><p id="ip">-</p></div>
          <div><span>ISP</span><p id="isp">-</p></div>
          <div><span>Location</span><p id="location">-</p></div>
          <div><span>Timezone</span><p id="timezone">-</p></div>
        </div>
      </div>

      <!-- STATS -->
      <div class="card">
        <h3>Statistics</h3>
        <div class="stats-grid">
          <div><span>Ping</span><p id="ping">0 ms</p></div>
          <div><span>Jitter</span><p id="jitter">0 ms</p></div>
          <div><span>Download</span><p id="download">0 Mbps</p></div>
          <div><span>Upload</span><p id="upload">0 Mbps</p></div>
        </div>
      </div>

      <!-- GRAPH -->
      <div class="card">
        <h3>Realtime Speed</h3>
        <canvas id="speedChart"></canvas>
      </div>

    </section>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2026 SpeedTest Tool</p>
  </footer>

</div>

<!-- SCRIPTS -->
<script src="./api.js"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>

</body>
</html>
